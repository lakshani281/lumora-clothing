<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumora Clothing</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font (Serif style for main heading) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .font-serif-heading {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="bg-gray-900 text-white">

    <!-- Hero Section Container -->
    <div class="relative min-h-screen flex flex-col justify-between bg-cover bg-center" style="background-image: linear-gradient(rgba(10, 20, 15, 0.75), rgba(10, 20, 15, 0.75)), url('images/hero-bg.jpg');">
        
        <!-- Navigation Bar -->
        <nav class="flex items-center justify-between px-8 py-6 max-w-7xl mx-auto w-full">
            <!-- Brand Logo -->
            <div class="text-2xl font-bold tracking-widest flex items-center">
                <span>Lumora</span>
                <span class="text-xs font-light tracking-normal ml-2 text-gray-300">CLOTHING</span>
            </div>

            <!-- Navigation Links -->
            <div class="hidden md:flex items-center space-x-2 bg-black/30 backdrop-blur-md px-4 py-2 rounded-full border border-white/10">
                <a href="#" class="bg-emerald-900/60 text-emerald-400 px-5 py-1.5 rounded-full text-sm font-medium border border-emerald-500/30">Home</a>
                <a href="#" class="text-gray-200 hover:text-white px-4 py-1.5 text-sm font-medium transition">Products</a>
                <a href="#" class="text-gray-200 hover:text-white px-4 py-1.5 text-sm font-medium transition">Bulk Orders</a>
                <a href="#" class="text-gray-200 hover:text-white px-4 py-1.5 text-sm font-medium transition">About Us</a>
                <a href="#" class="text-gray-200 hover:text-white px-4 py-1.5 text-sm font-medium transition">Contact</a>
            </div>

            <!-- Header Right Icons -->
            <div class="flex items-center space-x-5 text-gray-200">
                <button class="hover:text-white transition"><i class="fa-solid fa-magnifying-glass text-lg"></i></button>
                <button class="hover:text-white transition"><i class="fa-regular fa-heart text-lg"></i></button>
                <button class="hover:text-white transition"><i class="fa-solid fa-bag-shopping text-lg"></i></button>
                <button class="hover:text-white transition"><i class="fa-regular fa-user text-lg"></i></button>
            </div>
        </nav>

        <!-- Hero Content -->
        <main class="max-w-4xl mx-auto text-center px-4 py-20 my-auto">
            <!-- Badge -->
            <div class="inline-block border border-amber-500/50 bg-amber-900/10 px-5 py-1.5 rounded-full text-amber-400 text-xs tracking-widest font-semibold uppercase mb-8">
                PREMIUM SRI LANKAN APPAREL
            </div>

            <!-- Main Heading -->
            <h1 class="text-5xl md:text-7xl font-serif-heading font-semibold leading-tight tracking-wide mb-6">
                Wear Confidence.<br>
                <span class="italic font-normal">Wear Lumora.</span>
            </h1>

            <!-- Subtitle -->
            <p class="text-gray-300 text-lg md:text-xl max-w-2xl mx-auto mb-10 font-light leading-relaxed">
                Premium T-shirts crafted with comfort, quality, and modern style for every occasion.
            </p>

            <!-- CTA Buttons -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <a href="#" class="w-full sm:w-auto bg-emerald-700 hover:bg-emerald-600 text-white font-medium px-8 py-3.5 rounded-full transition duration-300">
                    Shop Collection
                </a>
                <a href="#" class="w-full sm:w-auto border border-gray-400 hover:border-white text-white font-medium px-8 py-3.5 rounded-full transition duration-300">
                    Bulk Orders
                </a>
            </div>
        </main>

        <!-- Empty footer space to balance center alignment -->
        <div class="pb-6"></div>
    </div>

</body>
</html>
